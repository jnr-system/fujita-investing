# 情報源の定義（DESIGN.md 6.2 の形式）
# フェーズ0（2026-10-09）に実際に取得して確認した結果。根拠と不採用の理由は docs/sources_review.md。
#   enabled: true  … 採用
#   enabled: false … 保留・未確認／取得禁止・ブロックのため不採用／Googleアラートの空欄
# URLを確認できなかった候補（味の素・ジョーシン・高島屋・イオンなど）はここに載せず、review にだけ「未確認」として記載。
# min_interval_minutes は DESIGN.md 6.5 の最短値（rss・json_api 30分、html_diff 360分）。
# html_diff は一覧ページの文字（リンクの文字・画像のalt・カードの文言）だけを使い、個別ページは取得しない（2026-10-09 ユーザー判断）。
# ゲームニュースのRSS（gamespark_news・automaton_news）は、今受け取れる無料配布を伝える記事だけを対象にする（DESIGN.md 2章「ニュース記事は除外」の例外。2026-10-09 ユーザー判断）。
# 「1個買うと1個もらえる」系（同じ商品・別の商品の無料引換券とも）は通知の対象（2026-10-09 ユーザー判断）。
# html_diff の link_selector（見る範囲のCSSセレクタ）と link_pattern（見るリンクのURLの正規表現）は省略可（フェーズ3で追加、2026-10-09 ユーザー確認）。
# 「# 監視:」のコメントは収集の実装（フェーズ1・3）向けのメモ。

# ============================================================ 採用
# ---- 共通（A・B）
# PR TIMES 新着プレスリリースRSS
# 監視: 全件RSS（200件で約2.5時間分）。カテゴリ別・キーワード別のフィードはない
- id: prtimes_all
  type: rss
  url: "https://prtimes.jp/index.rdf"
  scope: [A, B]
  genre_hint: [tcg, whisky, console, food, drink, daily, cvs, game]
  min_interval_minutes: 30
  enabled: true
  verified: "2026-10-09 robots.txt許可（Allow: /）、規約上の禁止なし、RSS 200件を確認"

